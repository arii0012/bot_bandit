name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install texture conversion dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Prepare optional character textures
        shell: pwsh
        run: |
          if (Test-Path "third_party/Square_Character") {
            python tools/prepare_character_assets.py "third_party/Square_Character"
          } else {
            Write-Host "Square_Character source is not present; skipping optional conversion."
          }

      - name: Configure (MSVC + Ninja)
        shell: cmd
        run: |
          where cl
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: cmd
        run: cmake --build build --config %BUILD_TYPE% --parallel

      - name: Stage game zip and setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter botbandit.exe | Select-Object -First 1
          if (-not $exe) { throw "botbandit.exe missing" }
          Copy-Item $exe.FullName stage/botbandit.exe
          if (Test-Path assets) { Copy-Item -Recurse assets stage/ }
          if (Test-Path shaders) { Copy-Item -Recurse shaders stage/ }
          if (Test-Path data) { Copy-Item -Recurse data stage/ } else { New-Item -ItemType Directory -Force -Path stage/data | Out-Null }
          Compress-Archive -Path stage/* -DestinationPath BotBandit-Windows-x64.zip -Force

          $setup = Get-ChildItem build -Recurse -Filter BotBandit_Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { $setup = Get-ChildItem build -Recurse -Filter LifeSim3D_Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($setup) { Copy-Item $setup.FullName BotBandit_Setup.exe }

          @(
            "$((Get-FileHash BotBandit-Windows-x64.zip -Algorithm SHA256).Hash.ToLower())  BotBandit-Windows-x64.zip"
          ) | Out-File -Encoding ascii SHA256SUMS.txt
          if (Test-Path BotBandit_Setup.exe) {
            Add-Content -Encoding ascii SHA256SUMS.txt "$((Get-FileHash BotBandit_Setup.exe -Algorithm SHA256).Hash.ToLower())  BotBandit_Setup.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BotBandit-Windows-x64
          path: |
            BotBandit-Windows-x64.zip
            BotBandit_Setup.exe
            SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: warn

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: BotBandit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            BotBandit-Windows-x64.zip
            BotBandit_Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Stage Linux package
        run: |
          mkdir -p stage
          cp build/botbandit stage/botbandit
          cp -R assets shaders data stage/
          tar -czf BotBandit-Linux-x64.tar.gz -C stage .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: BotBandit-Linux-x64
          path: BotBandit-Linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error
