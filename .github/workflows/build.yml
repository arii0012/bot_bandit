name: Build BotBandit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Optional Blender GLB
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path tools/generate_blender_assets.py) {
            choco install blender -y --no-progress
            $b = Get-ChildItem "C:\Program Files\Blender Foundation" -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($b) {
              New-Item -ItemType Directory -Force -Path assets/models | Out-Null
              & $b.FullName --background --python tools/generate_blender_assets.py
            }
          }

      
      - name: Prepare character textures
        continue-on-error: true
        run: |
          pip install Pillow || pip3 install Pillow || true
          python tools/prepare_character_assets.py || python3 tools/prepare_character_assets.py || true

      - name: Configure
        run: |
          choco install ninja -y --no-progress
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja -DCMAKE_CXX_FLAGS="/utf-8"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter botbandit.exe | Select-Object -First 1
          if (-not $exe) { throw "botbandit.exe missing" }
          Copy-Item $exe.FullName stage/botbandit.exe
          $setup = Get-ChildItem build -Recurse -Filter LifeSim3D_Setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName stage/LifeSim3D_Setup.exe }
          if (Test-Path assets) { Copy-Item -Recurse assets stage/ }
          if (Test-Path shaders) { Copy-Item -Recurse shaders stage/ }
          New-Item -ItemType Directory -Force -Path stage/data | Out-Null
          Compress-Archive -Path stage/* -DestinationPath BotBandit-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BotBandit-Windows-x64
          path: BotBandit-Windows-x64.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: LifeSim3D-Setup
          path: stage/LifeSim3D_Setup.exe
          retention-days: 14
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Optional Blender GLB
        continue-on-error: true
        run: |
          if [ -f tools/generate_blender_assets.py ]; then
            sudo apt-get install -y blender || true
            mkdir -p assets/models
            command -v blender >/dev/null && blender --background --python tools/generate_blender_assets.py || true
          fi

      
      - name: Prepare character textures
        continue-on-error: true
        run: |
          pip install Pillow || pip3 install Pillow || true
          python tools/prepare_character_assets.py || python3 tools/prepare_character_assets.py || true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Package
        run: |
          mkdir -p dist
          BIN=$(find build -name botbandit -type f | head -1)
          test -n "$BIN"
          cp "$BIN" dist/botbandit
          cp -r assets dist/ 2>/dev/null || true
          cp -r shaders dist/ 2>/dev/null || true
          cd dist && tar -czvf ../BotBandit-Linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: BotBandit-Linux-x64
          path: BotBandit-Linux-x64.tar.gz
          retention-days: 14

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BotBandit-Windows-x64/BotBandit-Windows-x64.zip
            artifacts/LifeSim3D-Setup/LifeSim3D_Setup.exe
            artifacts/BotBandit-Linux-x64/BotBandit-Linux-x64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
